name: Android APK (debug)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Web build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Capacitor sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Restore google-services.json + shared debug keystore
        run: |
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > /tmp/google-services.json
          mkdir -p ~/.android
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          GOOGLE_SERVICES_JSON_PATH=/tmp/google-services.json npm run android:patch
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: Gradle assembleDebug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: budget-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
