name: Android APK (debug)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Web build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Capacitor sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Restore google-services.json + shared debug keystore
        run: |
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > /tmp/google-services.json
          mkdir -p ~/.android
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/budgetapp.keystore
          cp /tmp/budgetapp.keystore ~/.android/debug.keystore
          keytool -list -keystore /tmp/budgetapp.keystore -storepass android -alias androiddebugkey > /dev/null
          keytool -list -v -keystore /tmp/budgetapp.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep SHA256
          GOOGLE_SERVICES_JSON_PATH=/tmp/google-services.json npm run android:patch
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: Gradle assembleDebug (explicit shared signing)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug \
            -Pandroid.injected.signing.store.file=/tmp/budgetapp.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Verify APK signature (fail on key drift)
        run: |
          ACTUAL=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep SHA256 | head -1 | sed 's/.*SHA256: //' | tr -d ':[:space:]')
          echo "APK cert SHA256: $ACTUAL"
          if [ -n "${{ vars.EXPECTED_CERT_SHA256 }}" ] && [ "$ACTUAL" != "${{ vars.EXPECTED_CERT_SHA256 }}" ]; then
            echo "SIGNATURE MISMATCH — expected ${{ vars.EXPECTED_CERT_SHA256 }}, got $ACTUAL"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: budget-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
