name: Deploy edge functions

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:

# Ships new/changed edge functions so device-facing behavior never drifts
# from the repo. Functions are deployed by name on purpose: never bulk
# deploy, so an unrelated local edit cannot take down a live function.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - name: Deploy push-event
        run: supabase functions deploy push-event --project-ref frxzokdrpvdqcmbkjwcw
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
