name: Release APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Integer build number (e.g. 2) — must exceed previous release"
        required: true
      version_name:
        description: "Display name (e.g. 0.1.2)"
        required: true
      notes:
        description: "Release notes"
        required: false
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Web build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Capacitor sync + version + signing
        run: |
          npx cap add android
          npx cap sync android
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > /tmp/google-services.json
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/budgetapp.keystore
          GOOGLE_SERVICES_JSON_PATH=/tmp/google-services.json \
          APK_VERSION_CODE="${{ inputs.version_code }}" \
          APK_VERSION_NAME="${{ inputs.version_name }}" \
          APK_KEYSTORE_PATH=/tmp/budgetapp.keystore \
          npm run android:patch
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Gradle assembleDebug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        env:
          APK_KEYSTORE_PATH: /tmp/budgetapp.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Publish GitHub Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "budget-app-v${{ inputs.version_name }}.apk"
          gh release create "apk-v${{ inputs.version_code }}" \
            "budget-app-v${{ inputs.version_name }}.apk" \
            --title "Budget App ${{ inputs.version_name }}" \
            --notes "${{ inputs.notes }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
