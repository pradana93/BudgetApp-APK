name: Release APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Integer build number (e.g. 2) — must exceed previous release"
        required: true
      version_name:
        description: "Display name (e.g. 0.1.2)"
        required: true
      notes:
        description: "Release notes"
        required: false
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Web build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Capacitor sync + version + signing
        run: |
          npx cap add android
          npx cap sync android
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > /tmp/google-services.json
          mkdir -p ~/.android
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /dev/null
          GOOGLE_SERVICES_JSON_PATH=/tmp/google-services.json \
          APK_VERSION_CODE="${{ inputs.version_code }}" \
          APK_VERSION_NAME="${{ inputs.version_name }}" \
          npm run android:patch
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: Gradle assembleDebug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK signature (fail on key drift)
        run: |
          ACTUAL=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep SHA256 | head -1 | sed 's/.*SHA256: //' | tr -d ':[:space:]')
          echo "APK cert SHA256: $ACTUAL"
          if [ -n "${{ vars.EXPECTED_CERT_SHA256 }}" ] && [ "$ACTUAL" != "${{ vars.EXPECTED_CERT_SHA256 }}" ]; then
            echo "SIGNATURE MISMATCH — expected ${{ vars.EXPECTED_CERT_SHA256 }}, got $ACTUAL"
            exit 1
          fi

      - name: Publish GitHub Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "budget-app-v${{ inputs.version_name }}.apk"
          gh release create "apk-v${{ inputs.version_code }}" \
            "budget-app-v${{ inputs.version_name }}.apk" \
            --title "Budget App ${{ inputs.version_name }}" \
            --notes "${{ inputs.notes }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
